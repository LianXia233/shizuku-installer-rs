name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 托管 runner 已预装 Android SDK 与 cmdline-tools。
      # 不使用 android-actions/setup-android@v3：该 action 内部会执行
      # `sdkmanager tools`，而新版 cmdline-tools 已移除 tools 包，直接以 exit 1 失败。
      - name: Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            SDK_ROOT=/usr/local/lib/android/sdk
          fi
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::未找到 sdkmanager（SDK_ROOT=$SDK_ROOT）"
            exit 1
          fi
          echo "SDK root    : $SDK_ROOT"
          echo "sdkmanager  : $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018"
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018"
          } >> "$GITHUB_ENV"

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Python dependencies
        run: python3 -m pip install --quiet pillow

      - name: Build
        run: bash scripts/build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShizukuInstaller
          path: ShizukuInstaller.apk
