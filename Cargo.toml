[workspace]
members = ["crates/core", "crates/android-ffi"]
resolver = "2"

[workspace.package]
version = "1.0.4"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/LianXia233/shizuku-installer-rs"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
